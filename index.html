<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hermione</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="toolbar">
        <span id="toolbar-title">Hermione</span>
        <button id="run-button">Run ▶</button>
        <button id="save-button">Save</button>
        <button id="load-button">Load</button>
        <button id="compile-button">Compile</button>
        <label id="snap-to-grid-toggle" class="toolbar-toggle">
          <input type="checkbox" id="snap-to-grid-checkbox" />
          Snap to Grid
        </label>
        <input id="load-file-input" type="file" accept="application/json" style="display: none" />
      </div>
      <div id="main-area">
        <div id="canvas-column">
          <div id="graph-tabs"></div>
          <div id="canvas-container">
            <canvas id="graph-canvas"></canvas>
            <div id="overlay"></div>
          </div>
        </div>
        <div id="sidebar-resizer" class="resizer resizer-vertical"></div>
        <div id="sidebar">
          <div id="functions-section" class="panel-section">
            <div id="functions-header" class="panel-header">
              <span class="panel-header-title">Functions</span>
              <button id="add-function-button" class="panel-header-add">+</button>
            </div>
            <div class="panel-body">
              <div id="functions-list" class="panel-list"></div>
            </div>
          </div>
          <div id="variables-section" class="panel-section">
            <div id="variables-header" class="panel-header">
              <span class="panel-header-title">Variables</span>
              <button id="add-variable-button" class="panel-header-add">+</button>
            </div>
            <div class="panel-body">
              <div id="variables-list" class="panel-list"></div>
            </div>
          </div>
          <div id="local-variables-section" class="panel-section">
            <div id="local-variables-header" class="panel-header">
              <span class="panel-header-title">Local Variables</span>
              <button id="add-local-variable-button" class="panel-header-add">+</button>
            </div>
            <div class="panel-body">
              <div id="local-variables-list" class="panel-list"></div>
            </div>
          </div>

          <div id="details-section">
            <div class="details-header">Details</div>
            <div id="variable-details" class="details-content">
              <div id="variable-details-name" class="details-item-name"></div>
              <div id="variable-details-fields"></div>
            </div>
            <div id="node-details" class="details-content">
              <div id="node-details-name" class="details-item-name"></div>
              <div id="node-details-fields"></div>
            </div>
            <div id="comment-details" class="details-content">
              <div class="details-item-name">Comment</div>
              <div id="comment-details-fields"></div>
            </div>
            <div id="function-details" class="details-content">
              <div id="inputs-section" class="panel-section">
                <div id="inputs-header" class="panel-header">
                  <span class="panel-header-title">Inputs</span>
                  <button id="add-input-button" class="panel-header-add">+</button>
                </div>
                <div class="panel-body">
                  <div id="inputs-list" class="panel-list"></div>
                </div>
              </div>
              <div id="outputs-section" class="panel-section">
                <div id="outputs-header" class="panel-header">
                  <span class="panel-header-title">Outputs</span>
                  <button id="add-output-button" class="panel-header-add">+</button>
                </div>
                <div class="panel-body">
                  <div id="outputs-list" class="panel-list"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div id="log-resizer" class="resizer resizer-horizontal"></div>
      <div id="log-panel"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
